name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    environment:
      name: production
      url: https://api.autoapply.app

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @autoapply/api exec prisma generate --schema prisma/schema.prisma

      - name: Build
        run: pnpm run build

      - name: Run all tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://autoapply:password@localhost:5432/autoapply
        run: pnpm run test && pnpm --filter @autoapply/api test:e2e

      - name: Build Docker image (production)
        run: |
          docker build \
            -t autoapply-api:${{ github.event.inputs.version }} \
            -f apps/api/Dockerfile .

      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: autoapply-api:${{ github.event.inputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'

      # Production deployment would go here (blue/green, rolling, etc.)
      # with health checks and automatic rollback

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: 'See CHANGELOG.md for details'

      - name: Notify team
        uses: 8398a7/action-slack@v3
        if: always() && env.SLACK_WEBHOOK_URL != ''
        with:
          status: ${{ job.status }}
          text: 'Production deployment v${{ github.event.inputs.version }}'
