name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autoapply
          POSTGRES_PASSWORD: password
          POSTGRES_DB: autoapply
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install customer frontend dependencies
        run: npm ci --prefix frontend

      - name: Install admin frontend dependencies
        run: npm ci --prefix frontend/admin-console

      - name: Generate Prisma Client
        run: pnpm --filter @autoapply/api exec prisma generate --schema prisma/schema.prisma

      - name: Lint
        run: pnpm --filter @autoapply/api lint

      - name: Type check
        run: pnpm run type-check

      - name: Setup database
        env:
          DATABASE_URL: postgresql://autoapply:password@localhost:5432/autoapply
        run: pnpm --filter @autoapply/api exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Run unit tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://autoapply:password@localhost:5432/autoapply
          REDIS_URL: redis://localhost:6379
        run: pnpm run test

      - name: Run test coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://autoapply:password@localhost:5432/autoapply
        run: pnpm --filter @autoapply/api test:cov

      - name: Upload coverage
        uses: codecov/codecov-action@v3

      - name: Security audit
        run: pnpm audit --prod --audit-level=moderate
