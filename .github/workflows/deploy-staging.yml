name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @autoapply/api exec prisma generate --schema prisma/schema.prisma

      - name: Build
        run: pnpm run build

      - name: Run tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://autoapply:password@localhost:5432/autoapply
        run: pnpm run test

      - name: Build Docker image (staging)
        run: |
          docker build \
            -t autoapply-api:staging-${{ github.sha }} \
            -f apps/api/Dockerfile .

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: autoapply-api:staging-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Note: Actual ECS deployment, ECR push, etc. would go here
      # For now, we're demonstrating the workflow structure

      - name: Notify Slack
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment complete'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
