name: Deploy to Staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autoapply
          POSTGRES_PASSWORD: password
          POSTGRES_DB: autoapply
        options: >-
          --health-cmd "pg_isready -U autoapply -d autoapply"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @autoapply/api exec prisma generate --schema prisma/schema.prisma

      - name: Build
        run: pnpm run build

      - name: Setup database
        env:
          DATABASE_URL: postgresql://autoapply:password@localhost:5432/autoapply
        run: pnpm --filter @autoapply/api exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Run tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://autoapply:password@localhost:5432/autoapply
          REDIS_URL: redis://localhost:6379/1
        run: pnpm run test

      - name: Build Docker image (staging)
        run: |
          docker build \
            -t autoapply-api:staging-${{ github.sha }} \
            -f apps/api/Dockerfile .

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: autoapply-api:staging-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      # Note: Actual ECS deployment, ECR push, etc. would go here
      # For now, we're demonstrating the workflow structure

      - name: Notify Slack
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment complete'
